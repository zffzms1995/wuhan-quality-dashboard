<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>武汉中心仓质量数据看板 V2</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f0f2f5;color:#1a1a2e;min-height:100vh}
.header{background:linear-gradient(135deg,#1a1a2e,#16213e 50%,#0f3460);color:#fff;padding:20px 32px;position:sticky;top:0;z-index:100}
.header h1{font-size:22px;font-weight:700}
.header-sub{font-size:12px;opacity:.7;margin-top:2px}
.filters{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px}
.filters label{font-size:12px;opacity:.8}
.filters input,.filters select{padding:6px 10px;border-radius:6px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.15);color:#fff;font-size:12px;outline:none}
.filters input::placeholder{color:rgba(255,255,255,.5)}
.filters select option{color:#1a1a2e;background:#fff}
.filter-btn{padding:6px 14px;border-radius:6px;border:none;background:#2563eb;color:#fff;font-size:12px;cursor:pointer;font-weight:500}
.filter-btn.reset{background:rgba(255,255,255,.2)}
.container{max-width:1500px;margin:0 auto;padding:20px}
.tab-nav{display:flex;gap:2px;background:#fff;border-radius:10px;padding:4px;margin-bottom:20px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.tab-btn{flex:1;padding:10px;border:none;background:none;cursor:pointer;font-size:14px;font-weight:500;color:#64748b;border-radius:8px;transition:.15s}
.tab-btn.active{background:#1a1a2e;color:#fff}
.tab-btn:hover:not(.active){color:#1a1a2e;background:#f1f5f9}
.tab-content{display:none}
.tab-content.active{display:block}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}
.kpi-card{background:#fff;border-radius:10px;padding:16px 20px;box-shadow:0 1px 3px rgba(0,0,0,.05);cursor:pointer;transition:.15s;border-left:4px solid transparent}
.kpi-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.1)}
.kpi-card.active-card{border-left-color:#2563eb}
.kpi-card .kpi-val{font-size:26px;font-weight:700;line-height:1.2}
.kpi-card .kpi-label{font-size:12px;color:#6b7280;margin-top:2px}
.kpi-card .kpi-sub{font-size:11px;color:#9ca3af}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.grid-2-1{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:20px}
.card{background:#fff;border-radius:10px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.05);margin-bottom:16px}
.card h3{font-size:15px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card h3 .icon{font-size:18px}
.badge{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:500;white-space:nowrap}
.bg-good{background:#dcfce7;color:#16a34a}
.bg-warn{background:#fef3c7;color:#d97706}
.bg-bad{background:#fee2e2;color:#dc2626}
.bg-info{background:#dbeafe;color:#2563eb}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:10px 12px;background:#f8fafc;color:#475569;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid #e2e8f0;white-space:nowrap;text-align:left}
td{padding:10px 12px;border-bottom:1px solid#f1f5f9}
tr:hover td{background:#f8fafc}
.clickable-row{cursor:pointer}
.clickable-row:hover td{background:#eff6ff!important}
.scroll-x{overflow-x:auto}
.rate-bar{display:inline-block;height:6px;border-radius:3px;background:#e2e8f0;min-width:50px;vertical-align:middle;margin-left:6px}
.rate-fill{height:100%;border-radius:3px}
.rate-fill.low{background:#16a34a}.rate-fill.mid{background:#d97706}.rate-fill.high{background:#dc2626}
.search-box{width:100%;padding:8px 12px;border:1px solid#e2e8f0;border-radius:8px;font-size:13px;outline:none;margin-bottom:12px}
.search-box:focus{border-color:#2563eb}
.diff-item{padding:10px 12px;margin-bottom:6px;background:#f8fafc;border-radius:8px;font-size:12px;border-left:3px solid#e2e8f0}
.diff-item.exec-error{border-left-color:#dc2626;background:#fef2f2}
.diff-item.obj-error{border-left-color:#2563eb;background:#eff6ff}
.diff-item .row{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px;margin-bottom:2px}
.diff-item .tag{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;margin-right:4px}
.tag-miss{background:#fee2e2;color:#dc2626}.tag-misjudge{background:#fef3c7;color:#d97706}.tag-obj{background:#dbeafe;color:#2563eb}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;justify-content:center;align-items:flex-start;padding:40px 20px;overflow-y:auto}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:12px;max-width:900px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-header{padding:16px 20px;border-bottom:1px solid#e2e8f0;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;z-index:1;border-radius:12px 12px 0 0}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:#94a3b8;padding:4px 8px;border-radius:4px}
.modal-close:hover{background:#f1f5f9;color:#1a1a2e}
.modal-body{padding:20px}
.img-thumb{cursor:pointer;max-width:60px;max-height:60px;border-radius:6px;border:2px solid#e2e8f0;transition:.15s}
.img-thumb:hover{border-color:#2563eb;transform:scale(1.05)}
.img-full{max-width:100%;max-height:70vh;border-radius:8px;display:block;margin:0 auto}
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:300;justify-content:center;align-items:center;cursor:pointer}
.lightbox.show{display:flex}
.lightbox img{max-width:90vw;max-height:90vh;border-radius:8px}
.problem-card{display:inline-block;padding:8px 14px;margin:4px;border-radius:8px;font-size:13px;cursor:pointer;background:#f1f5f9;transition:.15s}
.problem-card:hover{background:#e2e8f0}
.problem-card .count{font-size:20px;font-weight:700}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.empty{text-align:center;padding:40px;color:#9ca3af;font-size:14px}
.footer{text-align:center;padding:16px;color:#9ca3af;font-size:11px;border-top:1px solid#e2e8f0;margin-top:20px}
@media(max-width:768px){.grid-2,.grid-2-1{grid-template-columns:1fr}.header{padding:16px}.filters{flex-direction:column;align-items:stretch}}
</style>
</head>
<body>

<div class="header">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px">
    <div>
      <h1>武汉中心仓质量数据看板 V2</h1>
      <div class="header-sub" id="headerSub">数据加载中…</div>
    </div>
    <div class="filters">
      <label>日期范围</label>
      <input type="date" id="filterDateFrom" value="" onchange="applyFilters()">
      <span style="opacity:.5">—</span>
      <input type="date" id="filterDateTo" value="" onchange="applyFilters()">
      <label>人员</label>
      <select id="filterPerson" onchange="applyFilters()">
        <option value="">全部人员</option>
      </select>
      <button class="filter-btn reset" onclick="resetFilters()">清除筛选</button>
    </div>
  </div>
</div>

<div class="container">

<div class="tab-nav">
  <button class="tab-btn active" onclick="switchTab('overview',this)">概览</button>
  <button class="tab-btn" onclick="switchTab('qa',this)">QA抽检详情</button>
  <button class="tab-btn" onclick="switchTab('diffs',this)">差异明细</button>
  <button class="tab-btn" onclick="switchTab('motherboard',this)">主板审核</button>
  <button class="tab-btn" onclick="switchTab('summary',this)">问题汇总</button>
</div>

<!-- TAB: 概览 -->
<div class="tab-content active" id="tab-overview">
  <div class="kpi-grid" id="kpiCards"></div>
  <div class="grid-2">
    <div class="card"><h3>手机品类每日抽检趋势</h3><canvas id="phoneTrendChart" style="max-height:260px"></canvas></div>
    <div class="card"><h3>各品类差异率对比</h3><canvas id="catRateChart" style="max-height:260px"></canvas></div>
  </div>
  <div class="card"><h3>品类抽检量分布</h3><canvas id="catDistChart" style="max-height:260px"></canvas></div>
</div>

<!-- TAB: QA抽检详情 -->
<div class="tab-content" id="tab-qa">
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:14px">
      <h3 style="margin:0">人员质量达成表</h3>
      <div style="display:flex;gap:4px;flex-wrap:wrap" id="catQuickFilter"></div>
    </div>
    <input class="search-box" placeholder="搜索质检人姓名..." oninput="filterPersonnelTable(this.value)">
    <div class="scroll-x"><table id="personnelTable"><thead><tr><th>品类</th><th>小组</th><th>质检人</th><th>抽检量</th><th>差异量</th><th>差异率</th><th>评级</th><th>组内排名</th><th>质检失误</th></tr></thead><tbody></tbody></table></div>
    <div style="font-size:11px;color:#9ca3af;margin-top:8px">点击行查看该人员的差异明细</div>
  </div>
</div>

<!-- TAB: 差异明细 -->
<div class="tab-content" id="tab-diffs">
  <div class="card">
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px">
      <h3 style="margin:0">抽检差异明细记录</h3>
      <span class="badge bg-info" id="diffCountBadge"></span>
      <button class="filter-btn" onclick="toggleErrorOnly()" id="btnErrorOnly" style="margin-left:auto">仅显示执行问题</button>
    </div>
    <input class="search-box" placeholder="搜索型号/品牌/质检人/问题..." oninput="filterDiffTable(this.value)" id="diffSearchBox">
    <div id="diffDetailList" style="max-height:600px;overflow-y:auto"></div>
  </div>
</div>

<!-- TAB: 主板审核 -->
<div class="tab-content" id="tab-motherboard">
  <div class="grid-2-1">
    <div class="card"><h3>主板审核差异明细</h3><div class="scroll-x"><table id="mbTable"><thead><tr><th>图片</th><th>罚款</th><th>日期</th><th>品牌</th><th>机型</th><th>质检人</th><th>复核QA</th><th>差异项</th><th>质检勾选</th></tr></thead><tbody></tbody></table></div></div>
    <div class="card"><h3>主板审核人员统计</h3><canvas id="mbStatsChart" style="max-height:240px"></canvas><div id="mbSummary" style="margin-top:12px;font-size:12px"></div></div>
  </div>
</div>

<!-- TAB: 问题汇总 -->
<div class="tab-content" id="tab-summary">
  <div class="card"><h3>差异问题类型分布</h3><div class="summary-grid" id="problemSummaryGrid"></div></div>
  <div class="card"><h3>人员差异量排行</h3><canvas id="personRankChart" style="max-height:300px"></canvas></div>
</div>

<div class="footer" id="footerText">武汉中心仓质量数据看板 V2</div>
</div>

<!-- Drill-down Modal -->
<div class="modal-overlay" id="drillModal"><div class="modal"><div class="modal-header"><h3 id="modalTitle">差异明细</h3><button class="modal-close" onclick="closeModal()">&times;</button></div><div class="modal-body" id="modalBody"></div></div></div>

<!-- Image Lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()"><img id="lightboxImg" src=""></div>

<script>
// ====== DATA (运行时 fetch 加载) ======
var MB = [], DIFFS = [], FOURCAT_DIFFS = [];
var META = { monthLabel: '', dateMin: '', dateMax: '', updatedAt: '' };
var TREND = { phone: [], fourCat: {}, fourCatAgg: [] };

function loadData() {
  var failMsg = '数据加载失败：请确认已运行 update_dashboard.py 生成 dashboard_data.json / trend_data.json，并通过 http 服务打开本页面。';
  if (location.protocol === 'file:') {
    failMsg = '当前以 file:// 方式打开，浏览器禁止读取本地 JSON。请在「仓内看板」目录运行: python3 -m http.server 8765，然后访问 http://localhost:8765/';
  }
  Promise.all([
    fetch('dashboard_data.json').then(function(r){ if(!r.ok) throw new Error('dashboard_data.json HTTP '+r.status); return r.json(); }),
    fetch('trend_data.json').then(function(r){ if(!r.ok) throw new Error('trend_data.json HTTP '+r.status); return r.json(); })
  ]).then(function(results){
    var DATA = results[0];
    TREND = results[1] || TREND;
    META = DATA.meta || META;
    MB = DATA.mb || [];
    DIFFS = DATA.diffs || [];
    FOURCAT_DIFFS = DATA.fourcatDiffs || [];
    qaData = DATA.qaData || [];
    bootApp();
  }).catch(function(err){
    document.getElementById('kpiCards').innerHTML = '<div class="empty" style="grid-column:1/-1">'+failMsg+'<br>（'+err.message+'）</div>';
    document.getElementById('headerSub').textContent = '数据加载失败';
  });
}
// ====== GLOBAL STATE ======
var activeFilters = { dateFrom: '', dateTo: '', person: '', errorOnly: false };
var currentTab = 'overview';
var chartInstances = {};

function destroyChart(key) {
  if (chartInstances[key]) { chartInstances[key].destroy(); delete chartInstances[key]; }
}

// ====== INIT ======
function bootApp() {
  activeFilters.dateFrom = META.dateMin;
  activeFilters.dateTo = META.dateMax;
  document.getElementById('filterDateFrom').value = META.dateMin;
  document.getElementById('filterDateTo').value = META.dateMax;
  document.getElementById('headerSub').textContent = META.monthLabel + ' · 1+4品类质量数据 · 支持下钻与筛选';
  document.getElementById('footerText').textContent = '武汉中心仓质量数据看板 V2 · 数据来源: 飞书云表格「' + META.monthLabel + '武汉中心仓质量数据」 · 更新于 ' + META.updatedAt;

  // Populate person filter
  var people = new Set();
  DIFFS.forEach(function(d){if(d.errorPerson)people.add(d.errorPerson);if(d.origInspector)people.add(d.origInspector)});
  FOURCAT_DIFFS.forEach(function(d){if(d.errorPerson)people.add(d.errorPerson);if(d.inspector)people.add(d.inspector)});
  MB.forEach(function(d){if(d.inspector)people.add(d.inspector)});
  var sel = document.getElementById('filterPerson');
  sel.innerHTML = '<option value="">全部人员</option>';
  Array.from(people).sort().forEach(function(p){
    sel.innerHTML += '<option value="'+p+'">'+p+'</option>';
  });

  buildCatQuickFilter();
  buildKPIs();
  buildCharts();
  buildPersonnelTable();
  buildMBTable();
  buildProblemSummary();
}

loadData();
// ====== TAB SWITCHING ======
function switchTab(tab, btn) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active')});
  btn.classList.add('active');
  document.querySelectorAll('.tab-content').forEach(function(c){c.classList.remove('active')});
  document.getElementById('tab-'+tab).classList.add('active');
  if(tab==='overview') buildCharts();
  if(tab==='motherboard') buildMBChart();
  if(tab==='summary') buildPersonRankChart();
}

// ====== FILTERS ======
function applyFilters() {
  activeFilters.dateFrom = document.getElementById('filterDateFrom').value || META.dateMin;
  activeFilters.dateTo = document.getElementById('filterDateTo').value || META.dateMax;
  activeFilters.person = document.getElementById('filterPerson').value;
  refreshAll();
}

function resetFilters() {
  document.getElementById('filterDateFrom').value = META.dateMin;
  document.getElementById('filterDateTo').value = META.dateMax;
  document.getElementById('filterPerson').value = '';
  activeFilters = { dateFrom: META.dateMin, dateTo: META.dateMax, person: '', errorOnly: false };
  document.getElementById('btnErrorOnly').textContent = '仅显示执行问题';
  refreshAll();
}

function refreshAll() {
  buildKPIs();
  if(currentTab==='overview') buildCharts();
  if(currentTab==='qa') buildPersonnelTable();
  if(currentTab==='diffs') { renderDiffList(); updateDiffBadge(); }
  if(currentTab==='motherboard') { buildMBTable(); buildMBChart(); }
  if(currentTab==='summary') { buildProblemSummary(); buildPersonRankChart(); }
}

function isInFilter(d) {
  var df = activeFilters.dateFrom, dt = activeFilters.dateTo, p = activeFilters.person;
  if(d.date < df || d.date > dt) return false;
  if(p) {
    var match = false;
    ['errorPerson','origInspector','newInspector','inspector'].forEach(function(k){
      if(d[k] === p) match = true;
    });
    if(!match) return false;
  }
  return true;
}

// ====== KPI CARDS ======
function buildKPIs() {
  var filteredDiffs = DIFFS.filter(isInFilter);
  var filteredMB = MB.filter(isInFilter);

  var totalDiffs = filteredDiffs.length + FOURCAT_DIFFS.filter(isInFilter).length;
  var execErrors = filteredDiffs.filter(function(d){return d.qaJudgment==='执行问题'}).length;
  var objErrors = filteredDiffs.filter(function(d){return d.qaJudgment!=='执行问题'}).length;
  var mbPenalty = filteredMB.filter(function(d){return d.penalty==='是'}).length;
  var problemTypes = new Set(filteredDiffs.map(function(d){return d.level1}).filter(Boolean)).size;

  var cards = [
    {val:totalDiffs,label:'总差异记录',sub:'手机 + 四品类',cls:'',onclick:'switchTab("diffs",document.querySelectorAll(".tab-btn")[2])'},
    {val:execErrors,label:'执行问题',sub:'主观差异',cls:'color:#dc2626',onclick:'filterExecErrors()'},
    {val:objErrors,label:'客观问题',sub:'隐性问题+工艺问题',cls:'color:#2563eb',onclick:''},
    {val:mbPenalty,label:'主板审核罚款',sub:'共'+filteredMB.length+'条审核',cls:'color:#d97706',onclick:'switchTab("motherboard",document.querySelectorAll(".tab-btn")[3])'},
    {val:problemTypes,label:'问题类型数',sub:'一级分类',cls:'color:#7c3aed',onclick:'switchTab("summary",document.querySelectorAll(".tab-btn")[4])'}
  ];

  document.getElementById('kpiCards').innerHTML = cards.map(function(c,i){
    return '<div class="kpi-card" onclick="'+c.onclick+'" style="cursor:'+(c.onclick?'pointer':'default')+'"><div class="kpi-val" style="'+c.cls+'">'+c.val+'</div><div class="kpi-label">'+c.label+'</div><div class="kpi-sub">'+c.sub+'</div></div>';
  }).join('');

  // Update diff badge
  updateDiffBadge();
}

function filterExecErrors() {
  activeFilters.errorOnly = true;
  document.getElementById('btnErrorOnly').textContent = '显示全部';
  switchTab('diffs', document.querySelectorAll('.tab-btn')[2]);
  renderDiffList();
}

function toggleErrorOnly() {
  activeFilters.errorOnly = !activeFilters.errorOnly;
  document.getElementById('btnErrorOnly').textContent = activeFilters.errorOnly ? '显示全部' : '仅显示执行问题';
  renderDiffList();
}

function updateDiffBadge() {
  var filtered = DIFFS.filter(isInFilter).concat(FOURCAT_DIFFS.filter(isInFilter));
  if(activeFilters.errorOnly) filtered = filtered.filter(function(d){return d.qaJudgment==='执行问题' || d.isExecError});
  document.getElementById('diffCountBadge').textContent = filtered.length + ' 条';
}

// ====== CHARTS (Overview Tab) ======
function buildCharts() {
  // Phone trend
  var phoneTrend = TREND.phone || [];
  var ctx1 = document.getElementById('phoneTrendChart');
  if(ctx1) {
    destroyChart('phoneTrend');
    chartInstances['phoneTrend'] = new Chart(ctx1, {type:'line',data:{labels:phoneTrend.map(function(d){return d.date}),datasets:[{label:'抽检量',data:phoneTrend.map(function(d){return d.samples}),borderColor:'#3b82f6',backgroundColor:'rgba(59,130,246,.06)',fill:true,tension:.3,pointRadius:2,borderWidth:2,yAxisID:'y'},{label:'差异量',data:phoneTrend.map(function(d){return d.diffs}),borderColor:'#ef4444',backgroundColor:'rgba(239,68,68,.04)',fill:true,tension:.3,pointRadius:2,borderWidth:2,yAxisID:'y1'}]},options:{responsive:true,interaction:{intersect:false,mode:'index'},plugins:{legend:{position:'bottom',labels:{boxWidth:12,padding:14,font:{size:11}}}},scales:{y:{type:'linear',position:'left',title:{display:true,text:'抽检量',font:{size:11}},grid:{color:'#f1f5f9'}},y1:{type:'linear',position:'right',title:{display:true,text:'差异量',font:{size:11}},grid:{display:false},min:0},x:{grid:{display:false}}}}});
  }

  // Category rate
  var catMap = {};
  DIFFS.forEach(function(d){var k='📱手机';if(!catMap[k])catMap[k]={samples:0,errors:0};catMap[k].samples++;if(d.qaJudgment==='执行问题')catMap[k].errors++});
  FOURCAT_DIFFS.forEach(function(d){var k=d.cat;if(!catMap[k])catMap[k]={samples:0,errors:0};catMap[k].samples++;if(d.isExecError)catMap[k].errors++});
  var labels = Object.keys(catMap);
  var rates = labels.map(function(k){return catMap[k].samples>0?(catMap[k].errors/catMap[k].samples*100).toFixed(1):0});
  var bg = rates.map(function(r){return r>30?'#fca5a5':r>15?'#fde68a':'#86efac'});
  var ctx2 = document.getElementById('catRateChart');
  if(ctx2) {
    destroyChart('catRate');
    chartInstances['catRate'] = new Chart(ctx2, {type:'bar',data:{labels:labels,datasets:[{label:'执行差异率 (%)',data:rates.map(Number),backgroundColor:bg,borderRadius:4}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{callback:function(v){return v+'%'}},grid:{color:'#f1f5f9'}},x:{grid:{display:false}}}}});
  }

  // Category distribution
  var ctx3 = document.getElementById('catDistChart');
  if(ctx3) {
    destroyChart('catDist');
    chartInstances['catDist'] = new Chart(ctx3, {type:'bar',data:{labels:labels,datasets:[{label:'总记录数',data:labels.map(function(k){return catMap[k].samples}),backgroundColor:'#93c5fd',borderRadius:4},{label:'执行问题',data:labels.map(function(k){return catMap[k].errors}),backgroundColor:'#fca5a5',borderRadius:4}]},options:{responsive:true,indexAxis:'y',plugins:{legend:{position:'bottom',labels:{boxWidth:12,padding:14,font:{size:11}}}},scales:{x:{beginAtZero:true,grid:{color:'#f1f5f9'}},y:{grid:{display:false}}}}});
  }
}

// ====== PERSONNEL TABLE (QA Tab) ======
var qaData = [];

// Build category quick filter
function buildCatQuickFilter() {
  var cats = ['全部'].concat(Array.from(new Set(qaData.map(function(d){return d.cat}))));
  document.getElementById('catQuickFilter').innerHTML = cats.map(function(c,i){
    return '<button class="filter-btn'+(i===0?'':'')+'" style="font-size:11px;'+(i===0?'background:#1a1a2e;color:#fff':'')+'" onclick="filterByCat(\''+c+'\',this)">'+(c==='全部'?'全部':c)+'</button>';
  }).join('');
}

var qaCatFilter = '全部';
var qaSearchText = '';

function filterByCat(cat, btn) {
  qaCatFilter = cat;
  document.querySelectorAll('#catQuickFilter .filter-btn').forEach(function(b){b.style.background='';b.style.color=''});
  btn.style.background='#1a1a2e';btn.style.color='#fff';
  buildPersonnelTable();
}

function filterPersonnelTable(text) {
  qaSearchText = text ? text.toLowerCase() : '';
  buildPersonnelTable();
}

function buildPersonnelTable() {
  var data = qaData;
  if(qaCatFilter !== '全部') data = data.filter(function(d){return d.cat===qaCatFilter});
  if(qaSearchText) data = data.filter(function(d){return d.inspector.toLowerCase().indexOf(qaSearchText)>-1 || d.grp.toLowerCase().indexOf(qaSearchText)>-1});

  document.querySelector('#personnelTable tbody').innerHTML = data.map(function(d){
    var pct = d.rate*100;
    var cls = pct===0?'low':pct<1?'low':pct<2?'mid':'high';
    var bc = pct===0?'bg-good':pct<1?'bg-good':pct<2?'bg-warn':'bg-bad';
    return '<tr class="clickable-row" onclick="drillPerson(\''+d.inspector+'\')"><td>'+d.cat+'</td><td>'+d.grp+'</td><td><strong>'+d.inspector+'</strong></td><td>'+d.samples.toLocaleString()+'</td><td>'+(d.errors>0?'<span style="color:#dc2626">'+d.errors+'</span>':d.errors)+'</td><td>'+pct.toFixed(2)+'% <span class="rate-bar"><span class="rate-fill '+cls+'" style="width:'+Math.min(pct*25,100)+'%"></span></span></td><td><span class="badge '+bc+'">'+ (pct===0?'零差异':pct<1?'优秀':pct<2?'一般':'关注')+'</span></td><td>'+(d.ranking||'-')+'</td><td>'+(d.qaMiss||0)+'</td></tr>';
  }).join('');
}

// ====== DRILL DOWN: Person Detail ======
function drillPerson(name) {
  // Find all diffs involving this person
  var phonePersonDiffs = DIFFS.filter(function(d){return d.errorPerson===name || d.origInspector===name});
  var fourcatPersonDiffs = FOURCAT_DIFFS.filter(function(d){return d.errorPerson===name || d.inspector===name});
  var mbPersonDiffs = MB.filter(function(d){return d.inspector===name});

  var qaRow = qaData.find(function(d){return d.inspector===name});

  var html = '';
  if(qaRow) {
    html += '<div style="margin-bottom:16px;padding:12px;background:#f8fafc;border-radius:8px">';
    html += '<strong>'+qaRow.inspector+'</strong> | '+qaRow.grp+' | 抽检量: '+qaRow.samples.toLocaleString()+' | 差异率: '+(qaRow.rate*100).toFixed(2)+'% | 组内排名: '+(qaRow.ranking||'-')+' | QA失误: '+qaRow.qaMiss;
    html += '</div>';
  }

  if(phonePersonDiffs.length > 0) {
    html += '<h4 style="margin-bottom:8px">手机品类差异 ('+phonePersonDiffs.length+'条)</h4>';
    phonePersonDiffs.forEach(function(d){
      var cls = d.qaJudgment==='执行问题' ? 'exec-error' : 'obj-error';
      html += '<div class="diff-item '+cls+'"><div class="row"><span>'+d.date+' | '+d.brand+' '+d.model+'</span><span class="badge '+(d.qaJudgment==='执行问题'?'bg-bad':'bg-info')+'">'+d.qaJudgment+'</span></div><div>'+d.level1+(d.level2?' → '+d.level2:'')+'</div><div style="color:#94a3b8;font-size:11px">质检码: '+d.code+' | '+d.stage+' | '+(d.merchant||'')+' | 原质检人: '+(d.origInspector||'-')+' → 新质检人: '+(d.newInspector||'-')+'</div></div>';
    });
  }

  if(fourcatPersonDiffs.length > 0) {
    html += '<h4 style="margin-bottom:8px;margin-top:12px">四品类差异 ('+fourcatPersonDiffs.length+'条)</h4>';
    fourcatPersonDiffs.forEach(function(d){
      var cls = d.isExecError ? 'exec-error' : 'obj-error';
      html += '<div class="diff-item '+cls+'"><div class="row"><span>'+d.date+' | '+d.cat+' '+d.brand+' '+d.model+'</span>'+(d.isExecError?'<span class="badge bg-bad">执行问题</span>':'')+'</div><div>'+(d.detail||d.level1||'')+'</div><div style="color:#94a3b8;font-size:11px">质检码: '+d.code+' | '+(d.resultAction||'')+' | QA: '+(d.classify||'')+' '+(d.problemType||'')+'</div></div>';
    });
  }

  if(mbPersonDiffs.length > 0) {
    html += '<h4 style="margin-bottom:8px;margin-top:12px">主板审核差异 ('+mbPersonDiffs.length+'条)</h4>';
    mbPersonDiffs.forEach(function(d){
      html += '<div class="diff-item exec-error"><div class="row"><span>'+d.date+' | '+d.brand+' '+d.model+'</span><span class="badge bg-bad">触发罚款</span></div><div>'+d.qaFinding+'</div><div style="color:#94a3b8;font-size:11px">复核QA: '+d.qaReviewer+' | 商户: '+(d.merchant||'')+'</div></div>';
    });
  }

  if(html === '') html = '<div class="empty">该人员暂无差异记录</div>';

  openModal(name+' - 差异明细下钻', html);
}

// ====== DIFF LIST (Diffs Tab) ======
function renderDiffList() {
  var all = DIFFS.filter(isInFilter).concat(FOURCAT_DIFFS.filter(isInFilter));
  if(activeFilters.errorOnly) all = all.filter(function(d){return d.qaJudgment==='执行问题' || d.isExecError});

  document.getElementById('diffDetailList').innerHTML = all.map(function(d){
    var isExec = d.qaJudgment==='执行问题' || d.isExecError;
    var cls = isExec ? 'exec-error' : 'obj-error';
    var cat = d.cat || '手机';
    var name = d.errorPerson || d.inspector || d.origInspector || '';
    var detail = d.level2 || d.detail || d.level1 || '';
    return '<div class="diff-item '+cls+'"><div class="row"><strong>'+d.date+'</strong> | '+cat+' | '+d.brand+' '+d.model+' <span class="badge '+(isExec?'bg-bad':'bg-info')+'">'+(isExec?(d.qaJudgment||'执行问题'):(d.qaJudgment||'客观问题'))+'</span></div><div>'+detail+'</div><div style="color:#94a3b8;font-size:11px">质检码: '+d.code+' | 责任人: '+name+(d.severity?' | '+d.severity:'')+(d.stage?' | '+d.stage:'')+'</div></div>';
  }).join('') || '<div class="empty">筛选范围内无差异记录</div>';

  updateDiffBadge();
}

function filterDiffTable(text) {
  if(!text) { renderDiffList(); return; }
  var q = text.toLowerCase();
  var all = DIFFS.filter(isInFilter).concat(FOURCAT_DIFFS.filter(isInFilter));
  if(activeFilters.errorOnly) all = all.filter(function(d){return d.qaJudgment==='执行问题' || d.isExecError});
  all = all.filter(function(d){
    return (d.model||'').toLowerCase().indexOf(q)>-1 || (d.brand||'').toLowerCase().indexOf(q)>-1 || (d.level2||'').toLowerCase().indexOf(q)>-1 || (d.errorPerson||'').toLowerCase().indexOf(q)>-1 || (d.inspector||'').toLowerCase().indexOf(q)>-1 || (d.level1||'').toLowerCase().indexOf(q)>-1;
  });
  document.getElementById('diffDetailList').innerHTML = all.map(function(d){
    var isExec = d.qaJudgment==='执行问题' || d.isExecError;
    var cls = isExec ? 'exec-error' : 'obj-error';
    var cat = d.cat || '手机';
    var name = d.errorPerson || d.inspector || d.origInspector || '';
    return '<div class="diff-item '+cls+'"><div class="row"><strong>'+d.date+'</strong> | '+cat+' | '+d.brand+' '+d.model+' <span class="badge '+(isExec?'bg-bad':'bg-info')+'">'+(isExec?(d.qaJudgment||'执行问题'):(d.qaJudgment||'客观问题'))+'</span></div><div>'+(d.level2||d.detail||d.level1||'')+'</div><div style="color:#94a3b8;font-size:11px">'+d.code+' | '+name+'</div></div>';
  }).join('') || '<div class="empty">无匹配记录</div>';

  document.getElementById('diffCountBadge').textContent = all.length + ' 条';
}

// ====== MOTHERBOARD AUDIT ======
function buildMBTable() {
  var data = MB.filter(isInFilter);
  document.querySelector('#mbTable tbody').innerHTML = data.map(function(d){
    return '<tr class="clickable-row" onclick="viewMBImage(\''+d.imageFile+'\',\''+d.brand+' '+d.model+' - '+d.qaFinding+'\')"><td>'+(d.imageFile?'<img src="images/'+d.imageFile+'" class="img-thumb" loading="lazy" onclick="event.stopPropagation();viewMBImage(\''+d.imageFile+'\',\''+d.brand+' '+d.model+'\')">':'无图')+'</td><td><span class="badge '+(d.penalty==='是'?'bg-bad':'bg-good')+'">'+d.penalty+'</span></td><td>'+d.date+'</td><td>'+d.brand+'</td><td style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+d.model+'">'+d.model+'</td><td><strong>'+d.inspector+'</strong></td><td>'+d.qaReviewer+'</td><td style="color:#dc2626">'+d.qaFinding+'</td><td style="max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+d.qaCheck+'">'+(d.qaCheck||'-')+'</td></tr>';
  }).join('');
}

function viewMBImage(imgFile, title) {
  if(!imgFile) return;
  document.getElementById('lightboxImg').src = 'images/' + imgFile;
  document.getElementById('lightboxImg').alt = title || '';
  document.getElementById('lightbox').classList.add('show');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('show');
}

function buildMBChart() {
  var data = MB.filter(isInFilter);
  var map = {};
  data.forEach(function(d){
    if(!map[d.inspector]) map[d.inspector] = {total:0,penalty:0};
    map[d.inspector].total++;
    if(d.penalty==='是') map[d.inspector].penalty++;
  });
  var labels = Object.keys(map);
  var ctx = document.getElementById('mbStatsChart');
  if(ctx) {
    destroyChart('mbStats');
    chartInstances['mbStats'] = new Chart(ctx, {type:'bar',data:{labels:labels,datasets:[{label:'审核量',data:labels.map(function(k){return map[k].total}),backgroundColor:'#93c5fd',borderRadius:4},{label:'罚款',data:labels.map(function(k){return map[k].penalty}),backgroundColor:'#dc2626',borderRadius:4}]},options:{responsive:true,plugins:{legend:{position:'bottom',labels:{boxWidth:12,padding:12,font:{size:11}}}},scales:{y:{beginAtZero:true,ticks:{stepSize:1},grid:{color:'#f1f5f9'}},x:{grid:{display:false}}}}});
  }
  document.getElementById('mbSummary').innerHTML = labels.map(function(k){
    return '<div style="margin-bottom:3px"><strong>'+k+'</strong>: '+map[k].total+'条, '+map[k].penalty+'条罚款</div>';
  }).join('');
}

// ====== PROBLEM SUMMARY ======
function buildProblemSummary() {
  var all = DIFFS.filter(isInFilter).concat(FOURCAT_DIFFS.filter(isInFilter));
  var map = {};
  all.forEach(function(d){
    var key = d.level1 || d.problemType || '其他';
    if(!map[key]) map[key] = {count:0,examples:[]};
    map[key].count++;
    if(map[key].examples.length < 2) map[key].examples.push((d.model||'')+': '+(d.level2||d.detail||''));
  });

  var sorted = Object.entries(map).sort(function(a,b){return b[1].count - a[1].count});
  document.getElementById('problemSummaryGrid').innerHTML = sorted.map(function(e){
    var k = e[0], v = e[1];
    return '<div class="problem-card" onclick="filterByProblem(\''+k+'\')"><div class="count">'+v.count+'</div><div style="font-weight:600">'+k+'</div><div style="font-size:11px;color:#94a3b8">'+v.examples.join('<br>')+'</div></div>';
  }).join('');
}

function filterByProblem(type) {
  switchTab('diffs', document.querySelectorAll('.tab-btn')[2]);
  setTimeout(function(){
    document.getElementById('diffSearchBox').value = type;
    filterDiffTable(type);
  }, 100);
}

function buildPersonRankChart() {
  var all = DIFFS.filter(isInFilter).concat(FOURCAT_DIFFS.filter(isInFilter));
  var map = {};
  all.forEach(function(d){
    var p = d.errorPerson || d.inspector || d.origInspector;
    if(p) {
      if(!map[p]) map[p] = {total:0,exec:0};
      map[p].total++;
      if(d.qaJudgment==='执行问题' || d.isExecError) map[p].exec++;
    }
  });
  var sorted = Object.entries(map).sort(function(a,b){return b[1].total - a[1].total});
  var labels = sorted.map(function(e){return e[0]});

  var ctxp = document.getElementById('personRankChart');
  if(ctxp) {
    destroyChart('personRank');
    chartInstances['personRank'] = new Chart(ctxp, {type:'bar',data:{labels:labels,datasets:[{label:'总差异',data:sorted.map(function(e){return e[1].total}),backgroundColor:'#93c5fd',borderRadius:4},{label:'执行问题',data:sorted.map(function(e){return e[1].exec}),backgroundColor:'#fca5a5',borderRadius:4}]},options:{responsive:true,plugins:{legend:{position:'bottom',labels:{boxWidth:12,padding:14,font:{size:11}}}},scales:{y:{beginAtZero:true,ticks:{stepSize:1},grid:{color:'#f1f5f9'}},x:{grid:{display:false}}}}});
  }
}

// ====== MODAL ======
function openModal(title, body) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = body;
  document.getElementById('drillModal').classList.add('show');
}

function closeModal() {
  document.getElementById('drillModal').classList.remove('show');
}

// Close modal on overlay click
document.getElementById('drillModal').addEventListener('click', function(e) {
  if(e.target === this) closeModal();
});

// Keyboard shortcut
document.addEventListener('keydown', function(e) {
  if(e.key === 'Escape') { closeModal(); closeLightbox(); }
});
</script>
